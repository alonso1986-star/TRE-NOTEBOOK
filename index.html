<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRE Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151F29" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TRE Sim Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cockpit-style checklist — sticky header + code strip, sidebar of template sections on iPad, chips on iPhone; one section at a time. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14202D; --muted:#5B6976; --line:#D3DAE1;
  --accent:#1C5A9C; --accent-ink:#FFFFFF; --accent-soft:#E0EBF7;
  --amber:#A76300; --amber-soft:#FBEED6; --pf:#1B7451; --pf-soft:#DDF2E8; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#151F29; --surface-2:#1A2632; --ink:#E5ECF2; --muted:#92A2B1; --line:#283745;
  --accent:#73AAE6; --accent-ink:#0D141B; --accent-soft:#1B2F45;
  --amber:#EFB04D; --amber-soft:#3A2B12; --pf:#5DC79B; --pf-soft:#163428; --bad:#FF8B80; --bad-soft:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F29; --surface-2:#1A2632; --ink:#E5ECF2; --muted:#92A2B1; --line:#283745;
  --accent:#73AAE6; --accent-ink:#0D141B; --accent-soft:#1B2F45;
  --amber:#EFB04D; --amber-soft:#3A2B12; --pf:#5DC79B; --pf-soft:#163428; --bad:#FF8B80; --bad-soft:#3B1A18; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink);height:100%;overflow:hidden}
/* App shell: the shell follows the visible screen area (also when the iOS keyboard is open); only .scroller scrolls. */
#app{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);transform:translateY(var(--vvt,0px));display:flex;flex-direction:column;background:var(--bg);z-index:1}
.scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* header */
.top{flex:none;position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 6px rgba(10,20,30,.08)}
.top-row{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px}
.top-title{flex:1;min-width:0}
.top-title h1{font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pf);margin-right:6px;vertical-align:1px}
.save.err{color:var(--bad)}
@media (max-width:600px){.save{font-size:0}.save.ok::before{margin-right:0}.save.err::before{content:"!";font-size:14px;font-weight:700}}

/* code strip */
.codes{display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-top:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.codes::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-mono);font-size:13px;min-height:34px;min-width:38px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2)}
.chip.tag{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.flag{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.codes .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* layout */
.shell{display:grid;grid-template-columns:1fr;gap:16px;padding-block:16px 48px;max-width:1240px;margin:0 auto}
@media (min-width:900px){.shell{grid-template-columns:230px minmax(0,1fr);align-items:start}}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.nav::-webkit-scrollbar{display:none}
@media (min-width:900px){.nav{flex-direction:column;overflow:visible;position:sticky;top:16px}}
.nav button{flex:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;font-weight:500}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav .cnt{font-family:var(--f-mono);font-size:11px;opacity:.75}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sec-head h2{font-size:28px}
.sec-head .sub{color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:19px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea,.pilot textarea,.pilot input,.obs{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:9px 10px;font-size:16px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
textarea.obs{min-height:60px}
.auto{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.auto li{background:var(--surface-2);border-left:3px solid var(--line);border-radius:5px;padding:5px 8px;line-height:1.35}
.auto li.pos{border-left-color:var(--pf)}
.auto li.neg{border-left-color:var(--bad)}
.auto .xr{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:6px}
.tally{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.field input,.field select{height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;line-height:1.2;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:9px 10px;font-size:16px;min-height:42px}
.pair{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pair>input,.pair>select{flex:1 1 140px;min-width:0}
.pair .updt{display:flex;align-items:center;gap:6px;flex:none}
.exp{font-size:12px;font-weight:600;color:var(--amber)}
.exp.bad{color:var(--bad)}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:36px;min-width:40px;padding:0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.role button[data-val="PF"][aria-pressed="true"]{background:var(--pf);border-color:var(--pf);color:var(--accent-ink)}
.seg.role button[data-val="PM"][aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg.grade button[aria-pressed="true"][data-val="5"],.seg.grade button[aria-pressed="true"][data-val="F"],.seg button[aria-pressed="true"][data-val="FAIL"]{background:var(--bad);border-color:var(--bad)}
.seg button:disabled{opacity:.35}
.seg.td button.sug{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg.td button.sug[aria-pressed="true"],.seg.td button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* exercise card */
.ex{display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ex-code{font-family:var(--f-mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}
.ex-name{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.15}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ref{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.cond{color:var(--ink);font-weight:500}
.guide{font-size:13px;color:var(--muted);font-style:italic;max-width:75ch}
.ex.has-notes{border-left:3px solid var(--pf)}
.ex.has-fail{border-left:3px solid var(--bad)}
.hdr-row{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted);padding:8px 2px 0;border-top:1px dashed var(--line)}
.cu-days button{min-width:64px;font-size:16px;padding:0 10px}
.seg.sdr button[data-val="S"][aria-pressed="true"]{background:var(--pf);border-color:var(--pf);color:var(--accent-ink)}
.seg.sdr button[data-val="D"][aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--accent-ink)}
.seg.sdr button[data-val="R"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.loft details{border-top:1px solid var(--line);padding-top:8px}
.loft summary{cursor:pointer;font-weight:600;font-size:14px}
.loft-txt{white-space:pre-wrap;font-size:13.5px;line-height:1.5;margin-top:6px;color:var(--ink)}
.loft select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:9px 10px;font-size:16px;min-height:44px}
.done-card{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface-2);border-style:dashed;font-size:14px}
.trn-days{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.trn-days button{min-height:40px;min-width:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;font-weight:700;font-family:var(--f-display);font-size:18px}
.trn-days button:disabled{opacity:.4}
table.timing{border-collapse:collapse;font-size:13px;min-width:320px}
table.timing td,table.timing th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.grp{display:flex;flex-direction:column;gap:4px;padding-top:10px}
.grp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.grp-head h3{font-size:24px}
.ex-sub{font-size:13px;color:var(--muted)}
.seg.res button[data-val="PASS"][aria-pressed="true"]{background:var(--pf);border-color:var(--pf);color:var(--accent-ink)}
.pilot-top .ctrls{display:flex;gap:8px;flex-wrap:wrap}
.pilots{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.pilots{grid-template-columns:1fr 1fr}}
.pilot{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface-2);border-radius:8px;padding:10px}
.pilot textarea,.pilot input{background:var(--surface)}
.pilot-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.who b{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px;font-weight:500}
.comp-row{display:flex;align-items:center;gap:8px}
.comp-row .lbl{flex:none}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{width:72px;height:72px;border-radius:7px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.addphoto{position:relative;overflow:hidden}
.addphoto input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* summary */
.gtable{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(0,2fr) minmax(0,2fr);gap:14px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.pcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcell .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grow:last-child{border-bottom:0}
.grow .cname b{font-family:var(--f-mono);font-size:13px;display:block}
.grow .cname span{font-size:12px;color:var(--muted)}
.grow .pcol{display:flex;flex-direction:column;gap:3px}
.ghead{font-size:11px}
@media (max-width:760px){.grow{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:start;padding-block:10px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;padding-block:8px;font-size:15px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}

/* home */
.home{max-width:900px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:40px;line-height:1}
.newrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.newbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.newbtn .t{font-family:var(--f-display);font-size:24px;font-weight:700}
.newbtn .d{font-size:13px;color:var(--muted)}
.newbtn .plus{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.srow .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:2px}
.badge{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.srow .names{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* setup tables */
.tscroll{overflow-x:auto}
table.setup{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
table.setup th,table.setup td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.setup th{font-family:var(--f-mono);font-weight:500;color:var(--muted);white-space:nowrap}
table.setup td.on{background:var(--accent-soft)}

/* export */
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{font-size:14px;padding:8px 10px;border-radius:7px;background:var(--amber-soft);color:var(--ink)}
.issues li.ok{background:var(--pf-soft)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.banner{padding:10px 12px;border-radius:8px;background:var(--amber-soft);font-size:14px}
.banner.bad{background:var(--bad-soft)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,10,15,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-box{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px}
.lb-box img{width:100%;max-height:60vh;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>

<div id="app"></div>

<script src="./jspdf.umd.min.js"></script>
<script src="./jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";
/* ---------------- Template data (from the user's RST 3 / RST 4 .docx templates) ---------------- */
const COMPS=[["AOP","Application of Procedures"],["KNO","Knowledge"],["FPM-A","Flight Path Mgmt Auto"],["FPM-M","Flight Path Mgmt Manual"],["COM","Communication"],["L&T","Leadership & Teamwork"],["PSDM","Problem Solving & DM"],["SA","Situation Awareness"],["WLM","Workload Management"]];
const GRADES=[["1","1 Excellent"],["2","2 Very good"],["3","3 Good"],["4","4 Min. acceptable"],["5","5 Improvement req."]];
const GRADE_WORD={"1":"Excellent","2":"Very good","3":"Good","4":"Minimum acceptable","5":"Improvement required"};
const CODES=["+","-","P","D","STD","N/O","-> rec","-> no rec"];
const FLAGS=["REP","FREEZE"];
const TAGS=["AOP","K","FPM-A","FPM-M","COM","L&T","PSDM","SA","WLM"];
const PILOT_BLANK={indicators:"",name:"",crewcode:"",license:"",trir:"",trirUpdt:"",medical:"",medicalUpdt:"",passport:"",passportExp:"",techExam:"",elp:"",elpUpdt:"",attempt:"",outcome:"",failed:""};

const T={
 LPC:{key:"LPC",short:"RST 4 LPC",name:"RST 4 LPC",session:"RST 4 LPC",crew:false,
  sections:[
   {id:"h1",nav:"1st half",title:"First half",sub:"FO = PF / CPT = PM (adapt if different)",def:{cpt:"PM",fo:"PF"},items:[
    {id:"L1",name:"LOFT - INITIAL",pf:"CPT",refs:["1.4","1.6","SPA.LVO","3.4.7"],note:"Initial set-up, briefing, LVO items. Note PF/PM, CRM, SOP adherence."},
    {id:"L2",name:"LOFT - SCENARIO",pf:"CPT",refs:[],note:"Scenario events, NITS/PIOSEE, decisions. Note malfunction ID, handling, comms."},
    {id:"L3",name:"LOFT - APPROACH",refs:["3.8.1","6.2","6.3","6.4"],note:"Approach & landing. G/A at DH(A) +50/-0 ft. Circling: lateral manoeuvring by 300 ft AAL."},
    {id:"L4",name:"FO M.S. - W/S",refs:["3.4.2","3.4.5","3.6.5","SPA.LVO"],note:"Windshear recovery. Note trigger, recovery, PM calls."},

const MEM={sessions:new Map(),photos:new Map()};
const DB={
 db:null,ok:false,
 open(){return new Promise(res=>{
  try{const r=indexedDB.open("cuaderno-tre",1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("sessions"))d.createObjectStore("sessions",{keyPath:"id"});if(!d.objectStoreNames.contains("photos")){const p=d.createObjectStore("photos",{keyPath:"id"});p.createIndex("sessionId","sessionId")}};
   r.onsuccess=()=>{this.db=r.result;this.ok=true;res(true)};
   r.onerror=()=>res(false);r.onblocked=()=>res(false);
  }catch(e){res(false)}})},
 tx(store,mode,fn){
  if(!this.ok){return Promise.resolve(fn(null,store))}
  return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all(store){return this.tx(store,"readonly",(s,n)=>s?s.getAll():[...MEM[n].values()])},
 put(store,v){return this.tx(store,"readwrite",(s,n)=>s?s.put(v):void MEM[n].set(v.id,v))},
 del(store,k){return this.tx(store,"readwrite",(s,n)=>s?s.delete(k):void MEM[n].delete(k))},
 photosOf(sid){return this.tx("photos","readonly",(s)=>s?s.index("sessionId").getAll(sid):[...MEM.photos.values()].filter(p=>p.sessionId===sid))}
};

function newSession(type){

 const s={id:uid(),type,createdAt:Date.now(),updatedAt:Date.now(),date:today(),fstdCode:"",fstdType:"",crew:t.crew?"CPT / FO":"",examiner:"",
  pilots:{cpt:pilot(),fo:pilot()},ex:{},repeats:"",grades:{},body:"",debrief:{well:"",diff:""},sum:{improve:{cpt:"",fo:""},indRev:{cpt:"",fo:""},weakest2:{cpt:"",fo:""},weakest:{cpt:"",fo:""},trainingDay:{cpt:"",fo:""},outcome:{cpt:"",fo:""},failed:{cpt:"",fo:""}},admin:{},notes:{general:"",cpt:"",fo:""}};
 t.sections.forEach(sc=>sc.items.forEach(it=>{s.ex[it.id]=exDefault(sc,it)}));
 if(type==="LPC"||type==="CUCHK")s.lpc3=true;normalize(s);
 COMPS.forEach(([c])=>s.grades[c]={cpt:"",fo:"",obsCpt:"",obsFo:""});

function exDefault(sc,it){
 let cpt=sc.def.cpt||"",fo=sc.def.fo||"";
 const pf=it.pf||"";
 if(/^CPT(\s|$)/.test(pf)){cpt="PF";fo="PM"} else if(/^FO$/.test(pf)){cpt="PM";fo="PF"} else if(pf){cpt="";fo=""}
 return {cpt:{role:cpt,comp:"",notes:"",result:""},fo:{role:fo,comp:"",notes:"",result:""}};
}
function normalize(s){ // upgrade sessions saved by earlier versions
 ["cpt","fo"].forEach(k=>{s.pilots[k]={...PILOT_BLANK,...s.pilots[k]}});
 COMPS.forEach(([c])=>{const g=s.grades[c]||(s.grades[c]={cpt:"",fo:""});if(g.obsCpt==null)g.obsCpt=g.obs||"";if(g.obsFo==null)g.obsFo=g.obs||"";delete g.obs});
 s.notes=s.notes||{};["cpt","fo"].forEach(k=>{if(s.notes[k]==null)s.notes[k]=""});
 if(T[s.type].parts){s.gradesT=s.gradesT||{};COMPS.forEach(([c])=>{if(!s.gradesT[c])s.gradesT[c]={cpt:"",fo:"",obsCpt:"",obsFo:""}})}
 if(!s.sum.base)s.sum.base={cpt:"",fo:""};if(!s.sum.rec)s.sum.rec={cpt:"",fo:""};if(!s.loft)s.loft={l1:"",l2:""};if(s.type==="CUCHK"&&!s.cuKind)s.cuKind="LPC/OPC";
 if(s.body==null)s.body="";if(!s.debrief)s.debrief={well:"",diff:""};if(!s.sum.improve)s.sum.improve={cpt:"",fo:""};if(!s.sum.indRev)s.sum.indRev={cpt:"",fo:""};if(!s.sum.weakest2)s.sum.weakest2={cpt:"",fo:""};
 if(s.trainingDay==null){const td=(s.sum&&s.sum.trainingDay)||{};s.trainingDay=td.cpt||td.fo||""}
 if(s.type==="LPC"&&!s.lpc3){ // sessions saved with one card per item: merge the item cards back into their exercise card
  const moved={};
  Object.keys(s.ex).filter(k=>/^L\d+_/.test(k)).forEach(k=>{
   const g=k.split("_")[0],item=k.slice(g.length+1).replace(/-/g,".");const src=s.ex[k];
   const dst=s.ex[g]||(s.ex[g]={cpt:{role:"",comp:"",notes:"",result:""},fo:{role:"",comp:"",notes:"",result:""}});
   ["cpt","fo"].forEach(p=>{const a=src[p]||{},b=dst[p];if(!b.role&&a.role)b.role=a.role;
    const add=[(a.notes||"").trim(),a.result==="FAIL"?item+" FAIL":""].filter(Boolean).join("\n");
    if(add)b.notes=[(b.notes||"").trim(),add].filter(Boolean).join("\n")});
   delete s.ex[k];moved[k]=g;
  });
  s.lpc3=true;delete s.lpc2;if(Object.keys(moved).length)s._moved=moved;
 }
 T[s.type].sections.forEach(sc=>sc.items.forEach(it=>{if(!s.ex[it.id])s.ex[it.id]=exDefault(sc,it)}));
 return s;
}

function issues(){
 const out=[];
 if(!S.date)out.push("Session date is missing.");
 if(!S.fstdType)out.push("FSTD type (-800 / -8200) is missing.");
 if(S.type==="LPC"&&!S.trainingDay)out.push("Training Day (A–G) not assigned.");
 cuGradeAlerts().forEach(x=>out.push(x));
 if(S.type==="CUCHK"&&S.cuKind==="LST/OPC"&&!filled("D1"))out.push("LST/OPC: the raw data ILS approach to landing has no notes.");
 if(S.type==="CULOFT")["l1","l2"].forEach((k,i)=>{if(!S.loft[k])out.push(`LOFT scenario not selected for Student ${i+1}.`)});
 ["cpt","fo"].forEach(k=>{const p=S.pilots[k],l=pilotLabel(k);
  if(!p.name.trim())out.push(`${l} name is missing.`);
  if(!p.elp&&S.body!==k&&!isTRN()&&!(tpl().cu&&tpl().summary!=="LPC"))out.push(`${l} ELP is missing.`)});
 ["cpt","fo"].forEach(k=>{const f=allItems().filter(it=>S.ex[it.id][k].result==="FAIL").map(it=>it.code);if(f.length)out.push(`${pilotLabel(k)}: FAIL marked on ${f.join(", ")}. Check Failed items, Repeats and FEG 5.10.3 grading.`)});
 expiryAlerts().forEach(a=>out.push(`${a.who}: ${a.what} ${a.text} (${fmtDate(a.date)}). Tell the crew member.`));
 const items=allItems();const empty=items.filter(i=>!filled(i.id));
 if(empty.length)out.push(`${empty.length} of ${items.length} exercises have no notes (they will print empty; write N/O if not done).`);
 const noRole=items.filter(i=>!S.ex[i.id].cpt.role&&!S.ex[i.id].fo.role&&filled(i.id));
 if(noRole.length)out.push(`No PF/PM ticked on: ${noRole.map(i=>i.code||i.name).join(", ")}.`);
 return out;
}

/* ---------------- Photos ---------------- */
async function shrink(file){
 try{
  const bmp=await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file)});
  const max=1600;let w=bmp.naturalWidth,hh=bmp.naturalHeight;const sc=Math.min(1,max/Math.max(w,hh));w=Math.round(w*sc);hh=Math.round(hh*sc);
  const c=document.createElement("canvas");c.width=w;c.height=hh;c.getContext("2d").drawImage(bmp,0,0,w,hh);URL.revokeObjectURL(bmp.src);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));return {blob:blob||file,w,h:hh};
 }catch(e){return {blob:file,w:0,h:0}}
}
async function addPhoto(exId,file){
 toast("Adding photo…");
 const {blob,w,h:hh}=await shrink(file);
 const p={id:uid(),sessionId:S.id,exId,blob,w,h:hh,caption:"",createdAt:Date.now()};
 try{await DB.put("photos",p);P.push(p);
  const card=$("#ex-"+CSS.escape(exId));if(card){const it=allItems().find(i=>i.id===exId);card.outerHTML=exCard(it);autosizeAll()}
  toast("Photo added");dirty();

}

/* ---------------- Files out (artifact downloads / share sheet / plain download) ---------------- */
let dlPromise=null;
function getDownloads(){if(!dlPromise)dlPromise=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);return dlPromise}
async function giveFile(filename,blob){
 const dl=await getDownloads();
 if(dl){try{await dl.save({filename,data:blob});return "saved"}catch(e){if(e&&e.code==="declined")return "declined";if(e&&e.code==="rate_limited")return "busy"}}
 if(!window.claude){
  try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Session notes for Claude: competency analysis per pilot and general comment"});return "saved"}}catch(e){if(e&&e.name==="AbortError")return "declined"}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return "saved";
 }
 return "unavailable";
}

/* ---------------- PDF ---------------- */
function pt(s){return String(s??"").replace(/[‘’‛]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/→/g,"->").replace(/←/g,"<-").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/[•●]/g,"-").replace(/✓/g,"v").replace(/[^\n\r\t\x20-\x7E -ÿ]/g,"?")}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function evidenceList(){const order=allItems().map(i=>i.id);return P.slice().sort((a,b)=>order.indexOf(a.exId)-order.indexOf(b.exId)||a.createdAt-b.createdAt).map((p,i)=>({...p,label:"E"+(i+1)}))}
function fileBase(){const t=tpl();return `${S.date||"sin-fecha"}_${t.key}${S.fstdCode?"_"+S.fstdCode.replace(/[^\w-]+/g,""):""}`}

async function exportPDF(btn){
 const msg=$("#exportMsg");
 if(!window.jspdf||!window.jspdf.jsPDF){msg.innerHTML=`<div class="banner bad">The PDF generator did not load. Check the connection and reload the page. Meanwhile you can use "Copy notes as text".</div>`;return}
 btn.disabled=true;btn.textContent="Preparing PDF…";
 try{
  await saveNow();
  const blob=await buildPDF();
  const r=await giveFile(fileBase()+".pdf",blob);
  msg.innerHTML=r==="saved"?`<div class="banner" style="background:var(--pf-soft)">PDF ready (${Math.round(blob.size/1024)} KB). Attach it in the chat for the analysis.</div>`:r==="declined"?`<div class="banner">Saving was cancelled. Generate it again whenever you like.</div>`:r==="busy"?`<div class="banner">A save window is already open. Close it and try again.</div>`:`<div class="banner bad">This view cannot save files. Open the notebook from the Claude app, claude.ai or its own web address.</div>`;
 }catch(e){console.error(e);msg.innerHTML=`<div class="banner bad">Could not generate the PDF: ${h(e.message||e)}</div>`}
 btn.disabled=false;btn.textContent="Export to Claude";
}

   if(p.caption){doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...mut);doc.text(pt(p.caption),M,y+8.5,{maxWidth:maxW})}
   y+=p.caption?11:7;
   doc.addImage(data,"JPEG",M,y,dw,dh,undefined,"FAST");y+=dh+8;
  }
 }
 // footer
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...mut);
  doc.text(pt(`${t.session} | ${fmtDate(S.date)} | ${S.fstdCode||""}`),M,H-7);doc.text(`${i} / ${n}`,W-M,H-7,{align:"right"})}
 return doc.output("blob");
}

function fmtD(d){return d?fmtDate(d):""}
/* Competency tags in exercise notes: each line tagged with AOP, K/KNO, FPM-A, FPM-M, COM, L&T, PSDM, SA or WLM
   is shown under that competency for that pilot in the Summary, and printed with its exercise reference. */
const TAGMAP={AOP:"AOP",APP:"AOP",K:"KNO",KNO:"KNO","FPM-A":"FPM-A","FPM-M":"FPM-M",COM:"COM","L&T":"L&T",PSDM:"PSDM",SA:"SA",WLM:"WLM"};
const TAG_RE=/(^|[\s,;(\/])(FPM-A|FPM-M|L&T|PSDM|AOP|APP|KNO|COM|WLM|SA|K)(?=$|[\s,.;:)\/])/g;
let TG={cpt:{},fo:{}};
function tagged(k,secs){
 const out={};COMPS.forEach(([c])=>out[c]=[]);
 allItems().forEach(it=>{if(secs&&!secs.includes(it.sec.id))return;
  const e=S.ex[it.id];if(!e)return;
  (e[k].notes||"").split(/\n+/).forEach(line=>{
   const tags=new Set();line.replace(TAG_RE,(m,pre,t)=>{tags.add(TAGMAP[t]);return m});
   if(!tags.size)return;
   const text=line.replace(TAG_RE,"$1").replace(/\(\s*\)/g,"").replace(/\s{2,}/g," ").replace(/[\s,;:\/]+$/,"").trim();
   if(!text)return;
   tags.forEach(c=>out[c].push({ex:it.code||it.name,text,sign:/^\+/.test(text)?"pos":/^-(?!>)/.test(text)?"neg":""}));
  });
 });
 return out;
}
function autoList(c,k){const a=(TG[k]&&TG[k][c])||[];if(!a.length)return "";
 const pos=a.filter(x=>x.sign==="pos").length,neg=a.filter(x=>x.sign==="neg").length;
 return `<span class="tally">From exercises · ${pos}+ ${neg}-</span><ul class="auto">${a.map(x=>`<li class="${x.sign}"><span class="xr">${h(x.ex)}</span>${h(x.text)}</li>`).join("")}</ul>`}
function obsText(c,k,gk="grades"){const a=((TG[k]&&TG[k][c])||[]).map(x=>`${x.ex}: ${x.text}`);const m=((S[gk]||S.grades)[c][k==="cpt"?"obsCpt":"obsFo"]||"").trim();if(m)a.push(m);return a.join("\n")}
const EXPIRY_DAYS=60;
function expiry(d){ // alert if a validity/expiry date falls within 60 days of the session date
 if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
 const ref=new Date((S.date||today())+"T00:00:00"),dt=new Date(d+"T00:00:00");
 const days=Math.round((dt-ref)/86400000);
 if(days<0)return {days,bad:true,text:`expired ${-days} day${days===-1?"":"s"} before the session`};
 if(days<=EXPIRY_DAYS)return {days,bad:days<=14,text:days===0?"expires on the session day":`expires ${days} day${days===1?"":"s"} after the session`};
 return null;
}
function expiryAlerts(){const out=[];["cpt","fo"].forEach(k=>[["trir","TR/IR validity"],["medical","Medical"],["passportExp","Passport"]].forEach(([f,w])=>{const a=expiry(S.pilots[k][f]);if(a)out.push({...a,who:`${pilotLabel(k)}${pilotName(k)?" "+pilotName(k):""}`,what:w,date:S.pilots[k][f]})}));return out}
function expSpan(k,f){const a=expiry(S.pilots[k][f]);return `<span class="exp ${a&&a.bad?"bad":""}" data-exp="${k}.${f}">${a?"⚠ "+h(a.text[0].toUpperCase()+a.text.slice(1)):""}</span>`}
function refreshExp(){app.querySelectorAll("[data-exp]").forEach(el=>{const [k,f]=el.dataset.exp.split(".");const a=expiry(S.pilots[k][f]);el.textContent=a?"⚠ "+a.text[0].toUpperCase()+a.text.slice(1):"";el.classList.toggle("bad",!!(a&&a.bad))})}
function pilotRows(inclPass){
 if(isTRN()){const p=k=>S.pilots[k];return [["NAME",k=>p(k).name],["CREWCODE",k=>p(k).crewcode],["LPC OUTCOME",k=>p(k).outcome],["LPC FAILED ITEMS",k=>p(k).failed],["WEAKEST COMPETENCY (LPC)",k=>S.body===k?"Body":S.sum.weakest[k]],["TRE BEHAVIOURAL INDICATORS",k=>p(k).indicators],["TRAINING SCENARIO (EFOS)",k=>tpl().dayName]]}
 const p=k=>S.pilots[k];const u=v=>v?"  |  UPDT: "+v:"";const x=(k,f)=>{const a=expiry(S.pilots[k][f]);return a?"  |  (!) "+a.text.toUpperCase():""};
 return [["NAME",k=>p(k).name],["CREWCODE",k=>p(k).crewcode],["LICENSE No / TYPE",k=>p(k).license],
  ["TR/IR VALIDITY",k=>fmtD(p(k).trir)+u(p(k).trirUpdt)+x(k,"trir")],["MEDICAL EXPIRY",k=>fmtD(p(k).medical)+u(p(k).medicalUpdt)+x(k,"medical")],
  ...(inclPass?[["PASSPORT No",k=>p(k).passport]]:[]),["PASSPORT EXPIRY",k=>fmtD(p(k).passportExp)+x(k,"passportExp")],
  ["TECH EXAM",k=>p(k).techExam],["ELP",k=>(p(k).elp||"")+u(p(k).elpUpdt)],["ATTEMPT",k=>p(k).attempt],["OUTCOME",k=>p(k).outcome],["FAILED ITEMS",k=>p(k).failed]];
}
/* ---------------- Plain text ---------------- */
function sessionText(){
 const t=tpl();const L=[];const ev=evidenceList();const evBy={};ev.forEach(p=>{(evBy[p.exId]=evBy[p.exId]||[]).push(p.label)});
 L.push(`${t.session} - Session notes`,`Date: ${fmtDate(S.date)} | FSTD: ${S.fstdCode||"?"} | Type: ${S.fstdType||"?"}${t.crew?" | Crew: "+S.crew:""} | Examiner: ${S.examiner||""}`,"");
 ["cpt","fo"].forEach(k=>{L.push(`${pilotLabel(k)}: `+pilotRows(false).map(([l,f])=>`${l}: ${f(k)||"-"}`).join(" | "))});
 for(const s of t.sections){L.push("",`== ${s.title} (${s.sub}) ==`);
  if(s.loft){const sc=loftScenario(s.loft);L.push(sc?`LOFT ${sc.n} - ${sc.title} (${sc.route})`:"LOFT scenario not selected")}
  for(const it of s.items){(it.pre||[]).forEach(x=>L.push(`  [${x}]`));if(it.done){L.push(`- ${it.code} ${it.name}: ${it.note||"Completed in the LOFT"}`);continue}const e=S.ex[it.id];L.push(`- ${it.code?it.code+" ":""}${it.name}${it.itemName?" ("+it.itemName+")":""}${it.pf?" | PF: "+it.pf:""}${it.cond?" | "+it.cond:""}${it.refs.length?" | "+it.refs.join(" "):""}${evBy[it.id]?" | Evidence: "+evBy[it.id].join(", "):""}`);
   ["cpt","fo"].forEach(k=>{const x=e[k];L.push(`   ${pilotLabel(k)} [${x.role||"-"}${x.result?" "+x.result:""}]${x.comp?" COMP: "+x.comp:""}: ${(x.notes||"").trim().replace(/\n+/g," / ")||"-"}`)})}
  if(s.repeats)L.push(`- REPEATS: ${S.repeats||"-"}`)}
 if(t.summary!=="CUFFS")for(const part of parts(t)){L.push("",`== ${part.title} ==`);TG={cpt:tagged("cpt",part.secs),fo:tagged("fo",part.secs)};COMPS.forEach(([c])=>{const g=S[part.gk][c];const oc=obsText(c,"cpt",part.gk).replace(/\n/g," / "),of=obsText(c,"fo",part.gk).replace(/\n/g," / ");if(g.cpt||g.fo||oc||of)L.push(`${c}: ${pilotLabel("cpt")} ${GRADE_WORD[g.cpt]||"-"}${oc?" ("+oc+")":""} | ${pilotLabel("fo")} ${GRADE_WORD[g.fo]||"-"}${of?" ("+of+")":""}`)});}
 const sm=S.sum;L.push(`Weakest: ${sm.weakest.cpt||"-"} / ${sm.weakest.fo||"-"}`,`Outcome: ${sm.outcome.cpt||"-"} / ${sm.outcome.fo||"-"}`);
 if(t.summary==="CUFFS")["cpt","fo"].forEach(k=>L.push(`${pilotLabel(k)}: ${sdrCount(k)} | Deferred: ${sdrList(k,"D").map(x=>x.code).join(", ")||"-"} | Repeat: ${sdrList(k,"R").map(x=>x.code).join(", ")||"-"}${t.base?" | Restricted base: "+(S.sum.base[k]||"-"):""} | Comments: ${S.notes[k]||"-"}`));else if(t.summary==="CULOFT")L.push(`Recommended for CU check: ${S.sum.rec.cpt||"-"} / ${S.sum.rec.fo||"-"}`);else if(t.summary==="TRN")L.push(`Improvement observed: ${sm.improve.cpt||"-"} / ${sm.improve.fo||"-"}`,`TRE indicators reviewed: ${sm.indRev.cpt||"-"} / ${sm.indRev.fo||"-"}`,`Debrief - went well: ${S.debrief.well||"-"}`,`Debrief - differently: ${S.debrief.diff||"-"}`);else if(t.summary==="LPC")L.push(`Training day: ${S.trainingDay||"-"}`);else L.push(`Failed items: ${sm.failed.cpt||"-"} / ${sm.failed.fo||"-"}`);
 if((S.notes.cpt||"").trim()||(S.notes.fo||"").trim())L.push("","== General notes ==",`${pilotLabel("cpt")}: ${S.notes.cpt||"-"}`,`${pilotLabel("fo")}: ${S.notes.fo||"-"}`);if((S.notes.general||"").trim())L.push(`Earlier general notes: ${S.notes.general}`);
 return L.join("\n");
}
async function copyText(btn){
 const txt=sessionText();
 try{await navigator.clipboard.writeText(txt);toast("Notes copied. Paste them into the chat.")}
 catch(e){const m=$("#exportMsg");m.innerHTML=`<label class="field"><span class="lbl">Could not copy automatically: select the text and copy it</span><textarea id="copyArea" rows="10" readonly style="width:100%;font-family:var(--f-mono);font-size:12px">${h(txt)}</textarea></label>`;const a=$("#copyArea");a.focus();a.select()}
}

async function backup(btn){
 btn.disabled=true;
 try{
  const ss=await DB.all("sessions");const ph=await DB.all("photos");
  const photos=[];for(const p of ph){photos.push({...p,blob:await blobToDataURL(p.blob)})}
  const data=JSON.stringify({app:"cuaderno-tre",v:1,exportedAt:new Date().toISOString(),sessions:ss,photos});
  const r=await giveFile(`tre-notebook_backup_${today()}.json`,new Blob([data],{type:"application/json"}));

 }catch(e){toast("Could not create the backup")}
 btn.disabled=false;
}
$("#importFile").addEventListener("change",async e=>{
 const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
 try{const d=JSON.parse(await f.text());if(d.app==="tre-cu-loft-pack"){try{localStorage.setItem("tre.cuLoftPack",JSON.stringify(d));toast(`${d.scenarios.length} CU LOFT scenarios imported`);if(S)renderSession()}catch(x){toast("Could not store the scenarios on this device")}return}if(d.app!=="cuaderno-tre")throw new Error("formato");
  for(const s of d.sessions||[])await DB.put("sessions",s);
  for(const p of d.photos||[]){const blob=await (await fetch(p.blob)).blob();await DB.put("photos",{...p,blob})}
  toast(`Imported ${(d.sessions||[]).length} session${(d.sessions||[]).length===1?"":"s"}`);renderHome();
 }catch(err){toast("That file is not a TRE Sim Notebook backup")}
});

/* ---------------- Viewport (keeps the header visible when the iOS keyboard is open) ---------------- */
function toTop(){const sc=app.querySelector(".scroller");if(sc)sc.scrollTop=0}
(function(){const vv=window.visualViewport;if(!vv)return;
 const fit=()=>{document.documentElement.style.setProperty("--vvh",vv.height+"px");document.documentElement.style.setProperty("--vvt",Math.max(0,vv.offsetTop)+"px")};
 vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);fit();
 // when an input gets focus, keep it in view inside the scroller rather than letting the page shift
 document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input,select"))setTimeout(()=>{fit();e.target.scrollIntoView({block:"nearest"})},300)});
})();
/* Training Day Assignment Matrix (RST 4 Examiner Profiles 3.0, p.30): rows = Captain weakest, columns = First Officer weakest */
const TD_ORDER=["AOP","KNO","SA","FPM-M","WLM","PSDM","L&T","FPM-A","COM"];
const TD_MATRIX={
 "AOP":  ["D or E","D or F*","D or E","A or D","B or D","C,D or E","G or E","E","D"],
 "KNO":  ["D or F*","C or F*","E or F*","A or F*","B or F*","C or F*","G or F*","E or F*","D or F*"],
 "SA":   ["D or E","E or F*","E","A","B or E","C or E","E or G","E","E or G"],
 "FPM-M":["D or G","G or F*","G","A or G**","G","G","G","G","G"],
 "WLM":  ["B or D","B,C or F*","B or E","A","B or F*","B or C","G","B","B or D"],
 "PSDM": ["C or D","C or F*","B or E","A","B or C","C","C or G","E","C or D"],
 "L&T":  ["A or D","A or F*","A or E","A or F*","A or B","A or C","A or G**","B","A"],
 "FPM-A":["E","E or F*","E","A","B or E","C or E","E","E","E or D"],
 "COM":  ["D","D or F*","D or E","A,D or F*","B or D","D","G","D","D"]};
function tdSuggest(){
 // rows (y axis) = Captain, columns (x axis) = First Officer; single trainee with body: weakest on the x axis, 2nd weakest on the y axis
 const tr=trainee();const c=tr?(S.sum.weakest2||{})[tr]:S.sum.weakest.cpt,f=tr?S.sum.weakest[tr]:S.sum.weakest.fo;
 if(!TD_MATRIX[c]||TD_ORDER.indexOf(f)<0)return null;
 const raw=TD_MATRIX[c][TD_ORDER.indexOf(f)];
 let opts=[...new Set(raw.match(/[A-G]/g))];
 const no8=S.fstdType==="B737-800";if(no8)opts=opts.filter(x=>x!=="F");
 return {raw,opts,no8};
}
function tdField(){
 const sg=tdSuggest();
 const btns=["A","B","C","D","E","F","G"].map(x=>`<button type="button" data-td="${x}" aria-pressed="${S.trainingDay===x}" class="${sg&&sg.opts.includes(x)?"sug":""}" ${S.fstdType==="B737-800"&&x==="F"?"disabled":""}>${x}</button>`).join("");
 const tr=trainee();const hint=sg?`Matrix · ${tr?`${h(pilotLabel(tr))} weakest ${h(S.sum.weakest[tr])} (x) × 2nd weakest ${h(S.sum.weakest2[tr])} (y)`:`CPT ${h(S.sum.weakest.cpt)} × FO ${h(S.sum.weakest.fo)}`}: <b>${h(sg.raw)}</b>${sg.no8&&/F/.test(sg.raw)?" (F not available on the -800)":""}${/\*\*/.test(sg.raw)?`<br><span style="color:var(--amber);font-weight:600">** Examiner discretion: review the Training Day options so the desired pilot acts as Pilot Flying, and select the day based on the weaker candidate.</span>`:""}`:(trainee()?"Select the trainee's weakest and 2nd weakest competencies":"Select the weakest competency of both pilots")+" to get the Training Day from the matrix.";
 return `<div class="seg td">${btns}</div><span class="muted" style="font-size:13px">${hint}</span>`;
}
function refreshTD(){
 const sg=tdSuggest();
 if(sg&&sg.opts.length===1&&S.trainingDay!==sg.opts[0]){S.trainingDay=sg.opts[0];dirty()}
 const el=$("#tdField");if(el)el.innerHTML=tdField();
}
